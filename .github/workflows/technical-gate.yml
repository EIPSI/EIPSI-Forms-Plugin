name: T0 Technical gate

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-tests:
    name: PHP tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: All 963 PHP tests and strict RCT gate
        run: ./tests/ci/run.sh php

  js-tests:
    name: JS tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: All 68 JS tests
        run: ./tests/ci/run.sh js

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Real build and generated artifact checks
        run: ./tests/ci/run.sh build

  clean-smoke:
    name: Clean smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: New install, representative smoke and deactivate/reactivate
        run: ./tests/ci/run.sh smoke
