# Disposable M0 environment; never connects to the development database.
services:
  db:
    image: mariadb:11
    container_name: eipsi-purga-final-clean-db
    environment:
      MARIADB_DATABASE: m0
      MARIADB_USER: m0
      MARIADB_PASSWORD: m0-isolated
      MARIADB_ROOT_PASSWORD: m0-root-isolated
    networks:
      default:
        aliases:
          - eipsi-m0-db
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 2s
      timeout: 5s
      retries: 30
  wordpress:
    image: wordpress:latest
    container_name: eipsi-purga-final-clean-wordpress
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:18211:80'
    environment:
      WORDPRESS_DB_HOST: eipsi-m0-db:3306
      WORDPRESS_DB_NAME: m0
      WORDPRESS_DB_USER: m0
      WORDPRESS_DB_PASSWORD: m0-isolated
      WORDPRESS_DEBUG: '1'
      WORDPRESS_CONFIG_EXTRA: 'define("DISABLE_WP_CRON", true); define("WP_DEBUG_LOG", true); define("WP_DEBUG_DISPLAY", false);'
    volumes:
      - wordpress:/var/www/html
      - ../../:/var/www/html/wp-content/plugins/EIPSI-Forms-Plugin:ro
volumes:
  wordpress:
